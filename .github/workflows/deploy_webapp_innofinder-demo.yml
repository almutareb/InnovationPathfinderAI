# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - innofinder-demo

on:
  push:
    branches:
      - deploy_webapp
  workflow_dispatch:

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to registry
      uses: docker/login-action@v2
      with:
        registry: https://artidockers.azurecr.io/
        username: ${{ secrets.AzureAppService_ContainerUsername_f5d0a837dcfc4868a71ded230c8f3cdd }}
        password: ${{ secrets.AzureAppService_ContainerPassword_e85800efebd5410e95acda89e5d957d6 }}

    - name: Build and push container image to registry
      uses: docker/build-push-action@v3
      with:
        push: true
        tags: artidockers.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_f5d0a837dcfc4868a71ded230c8f3cdd }}/innofinder_demo:${{ github.sha }}
        file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'innofinder-demo'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_2543bd9d2127450a9fd79aeedb1d8c3c }}
        images: 'artidockers.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_f5d0a837dcfc4868a71ded230c8f3cdd }}/innofinder_demo:${{ github.sha }}'